name: Build HDR BOOTH for Windows
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run check
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: HDR-BOOTH-Windows-Installer
          path: dist/*.exe
